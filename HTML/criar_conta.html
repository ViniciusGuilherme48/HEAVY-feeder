<!DOCTYPE html>
<html lang="pt-BR">


<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - HEAVY Feeder</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS//login.css">


    <link rel="stylesheet" href="../CSS/treinos-responsive.css">
    <link rel="stylesheet" href="../CSS/padrao-site.css">
</head>

<body class="pagina-treinos">
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <header class="cabecalho-principal">
    <a class="logo-link" href="index.html" aria-label="Página inicial da Heavy Feeder">
        <img src="IMAGEM/logo heavy feeder png.png" alt="Logo Heavy Feeder" class="logo-principal">
    </a>
    <nav class="menu-principal" aria-label="Menu principal">
        <a href="index.html">Início</a>
        <a href="treinos.html">Treinos</a>
        <a href="Inicio-dieta.html">Dietas</a>
        <a href="calculadora.html">Calculadoras</a>
        <a href="login.html" class="botao-login">Login</a>
    </nav>
</header>

    <main class="container">

        <section class="criar-conta-card">

            <img
                src="IMAGEM/logo heavy feeder png.png"
                alt="Logo HEAVY Feeder"
                class="logo"
            >

            <h1>Criar sua conta</h1>

            <p class="subtitulo">
                Preencha seus dados para começar
            </p>

            <form action="cadastro-concluido.html">

                <div class="campo">

                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="confirmar">Confirmar senha</label>

                    <input
                        type="password"
                        id="confirmar"
                        placeholder="Digite a senha novamente"
                        minlength="6"
                        required
                    >

                </div>

                <div class="termos">

                    <input type="checkbox" id="termos" required>

                    <label for="termos">
                        Concordo com os
                        <a href="#">termos de uso</a>
                        e a
                        <a href="#">política de privacidade</a>.
                    </label>

                </div>

                <button class="botao-criar-conta" type="submit"> <a href="cadastro_concluido.html">
                    Criar Conta
                </button>
                </a>

            </form>

            <a href="login.html" class="voltar">
                ← Voltar para o login
            </a>

        </section>

    </main>

<footer class="rodape-principal">
    <p>Desenvolvido por alunos da Unisal - Campus São José | 2026</p>
    <nav aria-label="Links do rodapé"><a href="QuemSomos.html">Quem Somos</a><a href="mailto:contato@heavyfeeder.com.br">Fale Conosco</a></nav>
</footer>
</body>

</html>
