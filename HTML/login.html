<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login/HEAVY Feeder</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/login.css">


    <link rel="stylesheet" href="../CSS/treinos-responsive.css">
    <link rel="stylesheet" href="../CSS/padrao-site.css">
</head>

<body class="pagina-treinos">

    <header class="cabecalho-principal">
    <a class="logo-link" href="index.html" aria-label="Página inicial da Heavy Feeder">
        <img src="IMAGEM/logo heavy feeder png.png" alt="Logo Heavy Feeder" class="logo-principal">
    </a>
    <nav class="menu-principal" aria-label="Menu principal">
        <a href="index.html">Início</a>
        <a href="treinos.html">Treinos</a>
        <a href="Inicio-dieta.html">Dietas</a>
        <a href="calculadora.html">Calculadoras</a>
        <a href="login.html" class="botao-login">Login</a>
    </nav>
</header>

    <main class="login-container">

        <section class="login-card">

            <img src="IMAGEM/logo heavy feeder png.png" alt="Logo HEAVY Feeder" class="logo">

            <h1>Bem-vindo</h1>

            <p class="subtitulo">
                Entre na sua conta para continuar
            </p>

            <form action="index.html">

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="opcoes">

                    <label class="lembrar">
                        <input type="checkbox">
                        Lembrar de mim
                    </label>

                    <a href="recuperar_senha.html">
                        Esqueci minha senha
                    </a>

                </div>

                <button class="botao-entrar" type="submit">
                    Entrar
                </button>

            </form>

            <p class="cadastro">
                Ainda não possui uma conta?
                <a href="criar_conta.html">Criar conta</a>
            </p>

        </section>

    </main>

<footer class="rodape-principal">
    <p>Desenvolvido por alunos da Unisal - Campus São José | 2026</p>
    <nav aria-label="Links do rodapé"><a href="QuemSomos.html">Quem Somos</a><a href="mailto:contato@heavyfeeder.com.br">Fale Conosco</a></nav>
</footer>
</body>

</html>
