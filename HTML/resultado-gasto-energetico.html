    <link rel="stylesheet" href="../CSS/style-navegacao.css">
    <link rel="stylesheet" href="../CSS/style-icones.css">
</head>

<body class="pagina-treinos">
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
     <header class="cabecalho-principal">
    <a class="logo-link" href="index.html" aria-label="Página inicial da Heavy Feeder">
        <img src="IMAGEM/logo heavy feeder png.png" alt="Logo Heavy Feeder" class="logo-principal">

        </a>
    </nav>
</header>

    <main class="pagina-calculadora">

    <h1>Resultado - Gasto Energético</h1>

    <section class="resultado">
        <h3>Seu resultado</h3>
        <p>Metabolismo basal (BMR): <strong id="resBMR">-- kcal</strong></p>
        <p>Gasto energético (TDEE): <strong id="resTDEE">-- kcal</strong></p>
    </section>

    <a href="gasto-energetico.html" class="botao-voltar">← Calcular novamente</a>

    </main>
    <footer class="rodape-principal">
        <p>Desenvolvido por alunos da Unisal - Campus São jose 2026</p>
        <a href="QuemSomos.html"><b>Quem Somos</b></a>
        <a href="#"><b>Fale Conosco</b></a>
    </footer>

    <script>
        // Lê os valores que vieram no endereço da página (?bmr=...&tdee=...)
        const params = new URLSearchParams(window.location.search);

        const bmr = params.get("bmr");
        const tdee = params.get("tdee");

        // Só preenche se os valores existirem (se abrir a página direto, fica "--")
        if (bmr !== null) {
            document.getElementById("resBMR").textContent = bmr + " kcal";
            document.getElementById("resTDEE").textContent = tdee + " kcal";
        }
    </script>
</body>
