<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método de 7 Dobras</title>
    <link rel="stylesheet" href="../CSS/calculadora.css">
</head>

<body>

    <header class="cabecalho-principal">
        <figure>
            <img src="IMAGEM/logo heavy feeder png.png" alt="LOGO HEAVY FEEDER" width="300">
        </figure>

        <nav>
            <a href="index.html"><b>Inicio</b></a>
            <a href="treinos.html"><b>Treinos</b></a>
            <a href="Inicio-dieta.html"><b>Dietas</b></a>
            <a href="calculadora.html"><b>Calculadoras</b></a>
            <a href="login.html"><button class="botao-login">Login</button></a>
        </nav>
    </header>
   <main class="pagina-calculadora larga">

    <h1>🧮 Método de 7 Dobras Cutâneas</h1>

    <section class="card-calculadora">
        <form id="form7dobras">

            <div class="grade-campos">
                <div class="campo">
                    <label for="idade">Idade</label>
                    <input type="number" id="idade">
                </div>

                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso">
                </div>

                <div class="campo">
                    <label for="peitoral">Peitoral (mm)</label>
                    <input type="number" id="peitoral">
                </div>

                <div class="campo">
                    <label for="axilar">Axilar média (mm)</label>
                    <input type="number" id="axilar">
                </div>

                <div class="campo">
                    <label for="triceps">Tríceps (mm)</label>
                    <input type="number" id="triceps">
                </div>

                <div class="campo">
                    <label for="subescapular">Subescapular (mm)</label>
                    <input type="number" id="subescapular">
                </div>

                <div class="campo">
                    <label for="abdominal">Abdominal (mm)</label>
                    <input type="number" id="abdominal">
                </div>

                <div class="campo">
                    <label for="suprailiaca">Suprailíaca (mm)</label>
                    <input type="number" id="suprailiaca">
                </div>

                <div class="campo">
                    <label for="coxa">Coxa (mm)</label>
                    <input type="number" id="coxa">
                </div>
            </div>

            <button type="button" class="botao-entrar" onclick="calcular7dobras()">Calcular</button>
        </form>
    </section>

    <section id="resultado7dobras" class="resultado" style="display: none;">
        <h3>Resultado</h3>
        <p>Gordura corporal: <strong id="resGordura">--%</strong></p>
        <p>Massa gorda: <strong id="resMassaGorda">-- kg</strong></p>
        <p>Massa magra: <strong id="resMassaMagra">-- kg</strong></p>
    </section>

    <a href="calculadora.html" class="botao-voltar">← Voltar</a>

    </main>
    <footer class="rodape-principal">
        <p>Desenvolvido por alunos da Unisal - Campus São jose 2026</p>
        <a href="QuemSomos.html"><b>Quem Somos</b></a>
        <a href="#"><b>Fale Conosco</b></a>
    </footer>
</body>

</html>
