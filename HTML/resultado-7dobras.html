<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style-global.css">
    <link rel="stylesheet" href="../CSS/style-navegacao.css">
    <link rel="stylesheet" href="../CSS/style-calculadoras.css">
    <link rel="stylesheet" href="../CSS/style-icones.css">
</head>

<body class="pagina-treinos">
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <header class="cabecalho-principal">
        <a class="logo-link" href="index.html" aria-label="Página inicial da Heavy Feeder">
            <img src="IMAGEM/logo heavy feeder png.png" alt="Logo Heavy Feeder" class="logo-principal">
        </a>
        <nav class="menu-principal" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="treinos.html">Treinos</a>
            <a href="Inicio-dieta.html">Dietas</a>
            <a href="calculadora.html">Calculadoras</a>
            <a href="login.html" class="botao-login">Login</a>
            <a href="perfil.html" class="link-perfil" aria-label="Ir para o meu perfil">
                <img src="IMAGEM/avatar-padrao.png" alt="Foto do perfil" class="foto-perfil-menu">
            </a>
        </nav>
    </header>
   <main class="pagina-calculadora">

    <h1>Resultado - 7 Dobras Cutâneas</h1>

    <section class="resultado">
        <h3>Seu resultado</h3>
        <p>Gordura corporal: <strong id="resGordura">--%</strong></p>
        <p>Massa gorda: <strong id="resMassaGorda">-- kg</strong></p>
        <p>Massa magra: <strong id="resMassaMagra">-- kg</strong></p>
    </section>

    <a href="7dobras.html" class="botao-voltar">← Calcular novamente</a>

    </main>
    <footer class="rodape-principal">
        <p>Desenvolvido por alunos da Unisal - Campus São José | 2026</p>
        <nav aria-label="Links do rodapé">
            <a href="QuemSomos.html">Quem Somos</a>
        </nav>
    </footer>

    <script>
        // Lê os valores que vieram no endereço da página (?gordura=...&massaGorda=...)
        const params = new URLSearchParams(window.location.search);

        const gordura = params.get("gordura");
        const massaGorda = params.get("massaGorda");
        const massaMagra = params.get("massaMagra");

        // Só preenche se os valores existirem (se abrir a página direto, fica "--")
        // replace troca o ponto pela vírgula (13.7 vira 13,7)
        if (gordura !== null) {
            document.getElementById("resGordura").textContent = gordura.replace(".", ",") + " %";
            document.getElementById("resMassaGorda").textContent = massaGorda.replace(".", ",") + " kg";
            document.getElementById("resMassaMagra").textContent = massaMagra.replace(".", ",") + " kg";
        }
    </script>
</body>

</html>
