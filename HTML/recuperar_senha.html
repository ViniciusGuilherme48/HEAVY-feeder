<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha - HEAVY Feeder</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/recuperar_senha.css">

</head>

<body>
    <header class="cabecalho-principal">

    <nav>
        <a href="index.html"><b>Inicio</b></a>
        <a href="QuemSomos.html"><b>Quem Somos</b></a>
        <a href="treinos.html"><b>Treinos</b></a>
        <a href="calculadora.html"><b>Calculadoras</b></a>
        <a href="login.html"><button class="botao-login">Login</button></a>
    </nav>
    </header>

    <main class="container">

        <section class="card">

            <img
                src="IMAGEM/logo heavy feeder png.png"
                alt="Logo HEAVY Feeder"
                class="logo"
            >

            <h1>Recuperar senha</h1>

            <p class="texto">
                Digite o e-mail cadastrado e enviaremos
                as instruções para redefinir sua senha.
            </p>

            <form action="nova-senha.html">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <button type="submit">
                    Continuar
                </button>

            </form>

            <a href="login.html" class="voltar">
                ← Voltar para o login
            </a>

        </section>

    </main>

</body>

</html>
