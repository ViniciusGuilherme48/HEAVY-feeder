<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Heavy Feeder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style-global.css">
    <link rel="stylesheet" href="../CSS/style-navegacao.css">
    <link rel="stylesheet" href="../CSS/style-autenticacao.css">
</head>

<body class="pagina-treinos">
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <header class="cabecalho-principal">
        <a class="logo-link" href="index.html" aria-label="Página inicial da Heavy Feeder">
            <img src="IMAGEM/logo heavy feeder png.png" alt="Logo Heavy Feeder" class="logo-principal">
        </a>
        <nav class="menu-principal" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="treinos.html">Treinos</a>
            <a href="Inicio-dieta.html">Dietas</a>
            <a href="calculadora.html">Calculadoras</a>
            <a href="login.html" class="botao-login">Login</a>
            <a href="perfil.html" class="link-perfil" aria-label="Ir para o meu perfil">
                <img src="IMAGEM/avatar-padrao.png" alt="Foto do perfil" class="foto-perfil-menu">
            </a>
        </nav>
    </header>

    <main class="container">

        <section class="recuperar-card">

            <img
                src="IMAGEM/logo heavy feeder png.png"
                alt="Logo HEAVY Feeder"
                class="logo"
            >

            <h1>Recuperar senha</h1>

            <p class="texto">
                Digite o e-mail cadastrado e enviaremos
                as instruções para redefinir sua senha.
            </p>

            <form action="nova_senha.html">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
                 <button class="botao-continuar" type="submit">
                    Continuar
                </button>

            </form>

            <a href="login.html" class="voltar">
                ← Voltar para o login
            </a>

        </section>

    </main>

    <footer class="rodape-principal">
        <p>Desenvolvido por alunos da Unisal - Campus São José | 2026</p>
        <nav aria-label="Links do rodapé">
            <a href="QuemSomos.html">Quem Somos</a>
        </nav>
    </footer>
</body>

</html>
