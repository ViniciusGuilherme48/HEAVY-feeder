<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macronutrientes</title>
    <link rel="stylesheet" href="../CSS/calculadora.css">
</head>

<body>
    <header class="cabecalho-principal">
        <figure>
            <img src="IMAGEM/logo heavy feeder png.png" alt="LOGO HEAVY FEEDER" width="300">
        </figure>

        <nav>
            <a href="index.html"><b>Inicio</b></a>
            <a href="treinos.html"><b>Treinos</b></a>
            <a href="Inicio-dieta.html"><b>Dietas</b></a>
            <a href="calculadora.html"><b>Calculadoras</b></a>
            <a href="login.html"><button class="botao-login">Login</button></a>
        </nav>
    </header>
    <main class="pagina-calculadora">

    <h1>🥩 Calculadora de Macronutrientes</h1>

    <section class="card-calculadora">
        <form id="formMacro">

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso">
            </div>

            <div class="campo">
                <label for="objetivo">Objetivo</label>
                <select id="objetivo">
                    <option value="emagrecimento">Emagrecimento</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="ganho">Ganho de massa</option>
                </select>
            </div>

            <div class="campo">
                <label for="calorias">Calorias diárias (kcal)</label>
                <input type="number" id="calorias">
            </div>

            <button type="button" class="botao-entrar" onclick="calcularMacro()">Calcular</button>
        </form>
    </section>

    <section id="resultadoMacro" class="resultado" style="display: none;">
        <h3>Resultado</h3>
        <p>Proteínas: <strong id="resProteina">-- g</strong></p>
        <p>Carboidratos: <strong id="resCarboidrato">-- g</strong></p>
        <p>Gorduras: <strong id="resGordura">-- g</strong></p>
    </section>

    <a href="calculadora.html" class="botao-voltar">← Voltar</a>

    </main>
    <footer class="rodape-principal">
        <p>Desenvolvido por alunos da Unisal - Campus São jose 2026</p>
        <a href="QuemSomos.html"><b>Quem Somos</b></a>
        <a href="#"><b>Fale Conosco</b></a>
    </footer>
</body>

</html>
