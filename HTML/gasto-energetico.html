<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasto Energético</title>
    <link rel="stylesheet" href="../CSS/calculadora.css">
</head>

<body>

     <header class="cabecalho-principal">
        <figure>
            <img src="IMAGEM/logo heavy feeder png.png" alt="LOGO HEAVY FEEDER" width="300">
        </figure>

        <nav>
            <a href="index.html"><b>Inicio</b></a>
            <a href="treinos.html"><b>Treinos</b></a>
            <a href="Inicio-dieta.html"><b>Dietas</b></a>
            <a href="calculadora.html"><b>Calculadoras</b></a>
            <a href="login.html"><button class="botao-login">Login</button></a>
        </nav>
    </header>

    <main class="pagina-calculadora">

    <h1>🔥 Calculadora de Gasto Energético</h1>

    <section class="card-calculadora">
        <form id="formGasto">

            <div class="campo">
                <label for="sexo">Sexo</label>
                <select id="sexo">
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>
            </div>

            <div class="campo">
                <label for="idade">Idade</label>
                <input type="number" id="idade">
            </div>

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso">
            </div>

            <div class="campo">
                <label for="altura">Altura (cm)</label>
                <input type="number" id="altura">
            </div>

            <div class="campo">
                <label for="atividade">Nível de atividade</label>
                <select id="atividade">
                    <option value="1.2">Sedentário</option>
                    <option value="1.375">Pouco ativo</option>
                    <option value="1.55">Moderadamente ativo</option>
                    <option value="1.725">Muito ativo</option>
                    <option value="1.9">Extremamente ativo</option>
                </select>
            </div>

            <button type="button" class="botao-entrar" onclick="calcularGasto()">Calcular</button>
        </form>
    </section>

    <section id="resultadoGasto" class="resultado" style="display: none;">
        <h3>Resultado</h3>
        <p>Metabolismo basal (BMR): <strong id="resBMR">-- kcal</strong></p>
        <p>Gasto energético (TDEE): <strong id="resTDEE">-- kcal</strong></p>
    </section>

    <a href="calculadora.html" class="botao-voltar">← Voltar</a>

    </main>
    <footer class="rodape-principal">
        <p>Desenvolvido por alunos da Unisal - Campus São jose 2026</p>
        <a href="QuemSomos.html"><b>Quem Somos</b></a>
        <a href="#"><b>Fale Conosco</b></a>
    </footer>
</body>

</html>
