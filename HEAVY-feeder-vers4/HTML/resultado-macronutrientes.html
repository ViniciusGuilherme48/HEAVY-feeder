    <script>
        const params = new URLSearchParams(window.location.search);

        const proteina = params.get("proteina");
        const carboidrato = params.get("carboidrato");
        const gordura = params.get("gordura");

        if (proteina !== null) {
            document.getElementById("resProteina").textContent = proteina + " g";
